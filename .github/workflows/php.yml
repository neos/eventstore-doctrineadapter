name: CI

on:
  push:
    branches: [ "main", '[0-9]+.[0-9]' ]
  pull_request:
    branches: [ "main", '[0-9]+.[0-9]' ]

permissions:
  contents: read

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        php-versions: [ '8.2', '8.3', '8.4', '8.5' ]

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:latest
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: false
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: eventstore
        ports:
          - 3306/tcp
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
          POSTGRES_DB: eventstore
        ports:
          - 5432/tcp
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

    steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
        extensions: pdo_mysql, pdo_pgsql

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Prepare composer cache
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      shell: bash

    - name: Cache Composer packages
      uses: actions/cache@v3
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Require event store dev version
      run: composer require --no-update --no-interaction "neos/eventstore:2.0.x-dev as 2.0"

#    - name: Validate composer.json and composer.lock
#      run: composer validate --strict

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run tests (SQLIte)
      run: composer run-script test
      env:
        DB_DSN: "sqlite:///events_test.sqlite"

    - name: Run tests (MySQL)
      run: composer run-script test
      env:
        DB_DSN: "pdo-mysql://root:password@127.0.0.1:${{ job.services.mysql.ports['3306'] }}/eventstore"

    - name: Run tests (PostgreSQL)
      run: composer run-script test
      env:
        DB_DSN: "pdo-pgsql://root:password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/eventstore"
